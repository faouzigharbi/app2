<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مولّد أوراق المراجعة — devoirati</title>
<!-- LA POLICE N'EST PAS LIÉE ICI, ET C'EST VOULU. Une feuille de style
     déclarée avant un <script> retarde son exécution jusqu'à ce qu'elle
     réponde. Hors ligne — et cette page est faite pour l'être — la requête
     vers Google met TREIZE SECONDES à échouer, et l'écran reste blanc tout ce
     temps. Mesuré : 12 808 ms avec le lien, 274 ms sans. On l'ajoute donc
     depuis le script, une fois la page bâtie : en ligne la police arrive et
     remplace la précédente sans qu'on l'ait attendue, hors ligne la police du
     système fait l'affaire et personne ne s'en aperçoit. -->
<style>
  :root {
    --accent:#6c63ff; --texte:#2c3e50; --muet:#8798ab;
    --bord:#e4e9f0; --fond:#f6f8fb;
  }
  * { box-sizing:border-box; margin:0; padding:0 }
  body { font-family:'Cairo','Segoe UI',Tahoma,sans-serif; color:var(--texte);
         background:var(--fond); direction:rtl; padding:18px }
  .ecran, .feuille { max-width:860px; margin:0 auto }

  /* ─────────── L'ÉCRAN DE CHOIX ─────────── */
  .titre { text-align:center; margin-bottom:14px }
  .titre h1 { font-size:1.5em; color:var(--accent) }
  .titre p  { color:var(--muet); font-size:.95em; margin-top:4px }

  .carte { background:#fff; border:1px solid var(--bord); border-radius:14px;
           padding:16px 18px; margin-bottom:14px; box-shadow:0 2px 10px rgba(0,0,0,.04) }
  .carte h2 { font-size:1.05em; color:var(--accent); margin-bottom:10px }

  h3.niveau { font-size:.9em; color:var(--muet); margin:16px 0 7px;
              letter-spacing:.04em }
  h3.niveau:first-child { margin-top:2px }
  details { border:1px solid var(--bord); border-radius:11px; margin-bottom:7px;
            background:#fcfdff; overflow:hidden }
  details[open] { background:#fff; border-color:#cfd8e4 }
  summary { padding:10px 13px; cursor:pointer; font-weight:600; font-size:.96em;
            display:flex; align-items:center; gap:10px; list-style:none }
  summary::-webkit-details-marker { display:none }
  summary::before { content:'▸'; color:var(--muet); font-size:.9em }
  details[open] summary::before { content:'▾' }
  summary .n { margin-inline-start:auto; color:var(--muet); font-size:.82em;
               font-weight:400 }
  summary .tout { font-size:.78em; font-weight:400; color:var(--accent);
                  border:1px solid var(--accent); border-radius:12px;
                  padding:1px 9px }
  summary .tout:hover { background:var(--accent); color:#fff }
  .rubriques { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
               gap:8px; padding:2px 13px 13px }
  label.rub { display:flex; align-items:center; gap:9px; padding:9px 11px;
              border:1.5px solid var(--bord); border-radius:10px; cursor:pointer;
              background:#fcfdff; transition:.12s; font-size:.95em }
  label.rub:hover { border-color:#c3cfdd }
.exos { grid-column:1/-1; display:flex; flex-direction:column; gap:6px;
          margin:6px 0 10px; padding:8px; background:#0e1621; border-radius:8px }
  .exo-btn { text-align:right; background:#16202c; border:1px solid #22303f;
             color:#cfd9e4; border-radius:7px; padding:9px 11px; cursor:pointer;
             display:flex; flex-direction:column; gap:3px; font:inherit }
  .exo-btn:hover { border-color:var(--accent) }
  .exo-btn.pris { border-color:var(--accent); background:#1b2a3a }
  .exo-btn .t { font-size:.95em; line-height:1.6 }
  .exo-btn .b { font-size:.8em; color:#8798ab }
  button.rub { width:100%; text-align:right; font:inherit; cursor:pointer;
               background:transparent; border:0 }
  label.rub input { accent-color:var(--accent); width:17px; height:17px; cursor:pointer }
  label.rub.coche { border-color:var(--accent); background:#f5f4ff }
  label.rub .n { margin-inline-start:auto; color:var(--muet); font-size:.82em;
                 flex:none }
  /* Le nom occupe la place qui reste et se coupe en lignes ; sans cela,
     l'étiquette « مراجعة » poussait le compteur hors de la case. */
  label.rub input + span { flex:1; min-width:0 }
  label.rub input, label.rub .n { flex:none }

  .puces { display:flex; flex-wrap:wrap; gap:8px }
  .puce { padding:8px 15px; border:1.5px solid var(--bord); border-radius:20px;
          cursor:pointer; background:#fcfdff; font-size:.92em; user-select:none }
  .puce.on { border-color:var(--accent); background:var(--accent); color:#fff }

  .rangee { display:flex; flex-wrap:wrap; gap:22px; align-items:center }
  .rangee > div { display:flex; align-items:center; gap:9px }
  .rangee b { font-weight:600; font-size:.95em }

  .boutons { display:flex; gap:10px; flex-wrap:wrap; margin-top:4px }
  button.go { flex:1; min-width:180px; padding:13px; border:0; border-radius:11px;
              background:var(--accent); color:#fff; font-family:inherit;
              font-size:1.02em; font-weight:600; cursor:pointer }
  button.go:hover { filter:brightness(1.07) }
  button.sec { background:#fff; color:var(--accent); border:1.5px solid var(--accent) }
  button:disabled { opacity:.45; cursor:not-allowed }
  .avis { color:var(--muet); font-size:.88em; margin-top:9px; text-align:center }

  /* ─────────── LA FEUILLE ─────────── */
  .feuille { background:#fff; border:1px solid var(--bord); border-radius:14px;
             padding:26px 30px; margin-top:16px }
  .feuille:empty { display:none }
  .entete { border-bottom:2px solid var(--texte); padding-bottom:10px; margin-bottom:8px }
  .entete h2 { font-size:1.25em }
  .entete .lignes { display:flex; gap:26px; flex-wrap:wrap; margin-top:9px;
                    font-size:.93em; color:#4a5b6e }
  .entete .lignes span { border-bottom:1px dotted #93a4b6; min-width:160px;
                         padding-bottom:2px }

  .exo { padding:14px 0; border-bottom:1px dashed var(--bord); break-inside:avoid }
  .exo:last-child { border-bottom:0 }
  .exo .tete { display:flex; align-items:baseline; gap:10px; margin-bottom:8px }
  .exo .num { font-weight:700; color:var(--accent); font-size:1.05em; white-space:nowrap }
  .exo .rub { color:var(--muet); font-size:.82em; margin-inline-start:auto }
  .exo .enonce { font-size:1.05em; line-height:2 }
  .espace { border-inline-start:2px solid #eef1f6; margin:10px 6px 0 }

  .separation { margin:26px 0 12px; padding-top:12px; border-top:2px solid var(--texte);
                font-weight:700; font-size:1.15em; break-before:page }
  .corr { padding:11px 0; border-bottom:1px dashed var(--bord); break-inside:avoid }
  .corr .num { font-weight:700; color:var(--accent) }
  .corr ol { margin:7px 20px 0 0; line-height:1.95; font-size:.96em }
  .corr .quoi { color:#5b6b7f; font-size:.9em }

  /* ─── LE MATHÉMATIQUE AU MILIEU DE L'ARABE ───
     Ces règles ne sont pas décoratives : sans elles, « 16/25 » s'affiche
     « 1625 », parce que la fraction est empilée en deux <span> qui, faute
     d'être mis en bloc, retombent l'un à côté de l'autre. Elles viennent
     telles quelles des feuilles de style des fiches — même rendu, partout. */
  .expr { display:inline-block; white-space:nowrap; line-height:1.35 }
  span[dir=ltr] { unicode-bidi:isolate; font-family:'Segoe UI',Tahoma,sans-serif }
  .frac { display:inline-block; vertical-align:middle; text-align:center;
          margin:0 .12em; font-size:.92em }
  .frac .num { display:block; border-bottom:1.6px solid currentColor;
               padding:0 .3em 1px }
  .frac .den { display:block; padding:1px .3em 0 }
  .figure { display:block; margin:6px auto 10px; max-width:100%; height:auto }
  /* Un nom de point isolé, écrit comme sur la figure : sans cela, un « I »
     sans empattement au milieu de l'arabe se lit comme un alef. */
  .expr.pt { font-family:'Times New Roman',serif; font-style:italic;
             font-size:1.06em }
  sup { font-size:.72em }
  /* L'étiquette qui dit d'où vient l'exercice : discrète, mais lisible. */
  .rev { font-size:.72em; color:#6c63ff; border:1px solid currentColor;
         border-radius:3px; padding:0 .3em; margin-inline-start:.4em;
         vertical-align:middle }
  /* L'étiquette se coupe en lignes comme le reste : « nowrap » la faisait
     déborder de sa colonne et passer sous le compteur. */
  label.rub .rev { display:inline-block; max-width:100% }

  /* ─────────── L'IMPRESSION ─────────── */
  @page { size:A4; margin:14mm }
  @media print {
    body { background:#fff; padding:0 }
    .ecran, .nonimprime { display:none !important }
    .feuille { border:0; border-radius:0; padding:0; margin:0; max-width:none }
    .exo, .corr { break-inside:avoid }
    .separation { break-before:page }
  }
</style>
</head>
<body>

<div class="ecran">
  <div class="titre">
    <h1>مولّد أوراق المراجعة</h1>
    <p>اختر المواضيع، ثمّ عدد التمارين من كلّ موضوع — و اطبع الورقة</p>
  </div>

  <div class="carte">
    <h2>المواضيع</h2>
    <div id="chapitres"></div>
  </div>

  <div class="carte">
    <h2>الإعدادات</h2>
    <div class="rangee">
      <div><b>الإصلاح</b>
        <div class="puces" id="cor">
          <span class="puce on" data-c="1">مع الإصلاح</span>
          <span class="puce" data-c="0">بدونه</span>
        </div>
      </div>
    </div>
  </div>

  <div class="carte">
    <div class="boutons">
      <button class="go" id="creer">أنشئ الورقة</button>
      <button class="go sec" id="imprimer" disabled>اطبع / PDF</button>
    </div>
    <div class="avis" id="avis">لم تُختر أيّ رّبريكة بعد.</div>
  </div>
</div>

<div class="feuille" id="feuille"></div>

<!-- BIBLIOS -->
<script src="index-biblio.js"></script>
<!-- /BIBLIOS -->
<script>
(function () {
  'use strict';
  // LES EXERCICES N'ARRIVENT QU'AU TIRAGE. Le sélecteur se bâtit sur un
  // manifeste de 25 Ko ; les 8,7 Mo de bibliothèques attendaient jusqu'ici
  // d'être tous analysés avant le premier affichage — vingt secondes d'écran
  // blanc pour un élève qui va cocher deux rubriques.
  const INV = window.INVENTAIRE || [];
  // Chaque bibliothèque fait « window.BIBLIO = (window.BIBLIO||[]).concat(…) » :
  // elle REMPLACE le tableau. Garder une référence figée reviendrait à tirer
  // dans celui d'avant le chargement — donc dans le vide.
  const TOUT = () => (window.BIBLIO || []);
  const DIFF = { facile:'سهل', moyen:'متوسّط', difficile:'صعب' };
  const MOIS = ['جانفي','فيفري','مارس','أفريل','ماي','جوان',
                'جويلية','أوت','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

  // ── L'inventaire : quels chapitres, quelles rubriques, combien dans chacune.
  const chapitres = INV.map(c => ({
    cle: c.cle, nom: c.nom, niveau: c.niveau, fichiers: c.fichiers,
    rubriques: c.rubriques.map(r => ({ cle:r.cle, source:r.source, nom:r.nom,
                                       revision:r.revision, origine:r.origine,
                                       n:r.n, diff:r.diff })),
    n: c.rubriques.reduce((t, r) => t + r.n, 0)
  }));

  // ── LE CHARGEMENT À LA DEMANDE ──────────────────────────────────────────
  //
  // fetch() est interdit sur file:// — c'est pourquoi les bibliothèques sont
  // des .js et non des .json. Injecter une balise <script>, en revanche, reste
  // permis : c'est ainsi qu'on va les chercher, une par chapitre choisi.
  const CHARGES = new Set();
  function charger(fichiers) {
    const restants = fichiers.filter(f => f && !CHARGES.has(f));
    if (!restants.length) return Promise.resolve();
    return Promise.all(restants.map(f => new Promise((ok, ko) => {
      const t = document.createElement('script');
      t.src = f;
      t.onload = () => { CHARGES.add(f); ok(); };
      t.onerror = () => ko(new Error(f));
      document.head.appendChild(t);
    })));
  }

  const el = s => document.querySelector(s);
  const zone = el('#chapitres');
  if (!chapitres.length) {
    zone.innerHTML = '<p style="color:#8798ab">المكتبة فارغة.</p>';
  }

  // VINGT-TROIS CHAPITRES ET CENT QUATRE-VINGT-DOUZE RUBRIQUES ne se posent pas
  // à plat sur un écran : on n'y trouve plus rien. On range donc par NIVEAU, et
  // chaque chapitre se déplie quand on le demande — fermé, il tient sur une
  // ligne et annonce ce qu'il contient.
  [7, 8, 9].forEach(niv => {
    const dedans = chapitres.filter(c => c.niveau === niv);
    if (!dedans.length) return;
    const sec = document.createElement('div');
    sec.innerHTML = '<h3 class="niveau">' + niv + ' أساسي</h3>';
    dedans.forEach(c => {
      const d = document.createElement('details');
      d.innerHTML = '<summary>' + c.nom
        + '<span class="tout" data-c="' + c.cle + '">الكلّ</span>'
        + '<span class="n">' + c.n + '</span></summary>'
        + '<div class="rubriques">' + c.rubriques.map(r =>
          '<button class="rub" data-c="' + c.cle
          + '" data-s="' + r.source + '" data-r="' + r.cle + '"><span>' + r.nom
          + (r.revision ? ' <span class="rev">مراجعة' + (r.origine ? ' · ' + r.origine : '')
             + '</span>' : '')
          + '</span><span class="n">' + r.n + '</span></button>'
        ).join('') + '</div>';
      sec.appendChild(d);
    });
    zone.appendChild(sec);
  });

  // « الكلّ » coche ou décoche tout un chapitre d'un geste — et n'ouvre ni ne
  // ferme le dépliant au passage.
  zone.addEventListener('click', e => {
    const t = e.target.closest('.tout');
    if (!t) return;
    e.preventDefault(); e.stopPropagation();
    const boites = [...zone.querySelectorAll('.rub input[data-c="' + t.dataset.c + '"]')];
    const cocher = boites.some(b => !b.checked);
    boites.forEach(b => { b.checked = cocher;
                          b.closest('.rub').classList.toggle('coche', cocher); });
    etat();
  });

  // ── Les puces : une seule choisie pour le nombre et le corrigé, plusieurs
  //    pour le niveau — on ne veut pas d'une feuille sans aucun niveau.
  function puces(id, unique) {
    el('#' + id).addEventListener('click', e => {
      const p = e.target.closest('.puce');
      if (!p) return;
      if (unique) [...p.parentNode.children].forEach(x => x.classList.remove('on'));
      p.classList.toggle('on', unique ? true : !p.classList.contains('on'));
      if (!unique && !p.parentNode.querySelector('.on')) p.classList.add('on');
      etat();
    });
  }
  puces('niv', false); puces('nb', true); puces('cor', true);
  document.addEventListener('change', e => {
    if (e.target.matches('.rub input')) {
      e.target.closest('.rub').classList.toggle('coche', e.target.checked);
      etat();
    }
  });

  // On retient la fiche D'ORIGINE : le regroupement est un classement pour
  // l'œil, mais les exercices, eux, portent toujours leur ancien chapitre.
  // ── LE CHOIX SE FAIT À LA MAIN, EXERCICE PAR EXERCICE ───────────────────
  //
  // Les versions d'avant tiraient au sort dans les rubriques cochées, et le
  // maître découvrait sa feuille après coup. Ce n'est pas ainsi qu'on prépare
  // un devoir : on VOIT les exercices, on lit ce qu'ils contiennent, et l'on
  // prend ceux qu'on veut.
  //
  // Quatre niveaux, chacun ouvre le suivant :
  //     le niveau → le chapitre → la rubrique → LES EXERCICES
  // et chaque bouton d'exercice dit son contenu : sa première ligne, son
  // nombre de questions, sa difficulté. Un clic le met dans la feuille, un
  // second l'en retire.
  const PANIER = [];
  const avecCor = () => el('#cor .puce.on').dataset.c === '1';
  const sansBalise = t => String(t).replace(/<br>/g, ' ').replace(/<[^>]+>/g, '').trim();
  const compteQ = x => Math.max(1, (String(x.enonce).match(/class="q"/g) || []).length);

  function etat() {
    el('#creer').disabled = !PANIER.length;
    el('#imprimer').disabled = !PANIER.length;
    el('#avis').textContent = PANIER.length
      ? PANIER.length + ' تمارين في الورقة'
      : 'اختر رّبريكة ثمّ تمرينا.';
  }

  // La liste des exercices d'une rubrique, dépliée sous elle.
  function ouvrir(bouton) {
    const suivant = bouton.nextElementSibling;
    if (suivant && suivant.classList.contains('exos')) { suivant.remove(); return; }
    [...document.querySelectorAll('.exos')].forEach(n => n.remove());
    const c = chapitres.find(k => k.cle === bouton.dataset.c);
    const boite = document.createElement('div');
    boite.className = 'exos';
    boite.textContent = '…';
    bouton.after(boite);
    charger(c.fichiers).then(() => {
      const liste = TOUT().filter(x => x.chapitre === bouton.dataset.s
                                    && x.rubrique === bouton.dataset.r);
      if (!liste.length) { boite.textContent = 'لا شيء هنا.'; return; }
      boite.innerHTML = liste.map(x =>
        '<button class="exo-btn' + (PANIER.indexOf(x.id) >= 0 ? ' pris' : '') + '"'
        + ' data-id="' + x.id + '">'
        + '<span class="t">' + sansBalise(x.enonce).slice(0, 110) + '…</span>'
        + '<span class="b">' + compteQ(x) + ' أسئلة'
        + (x.difficulte ? ' · ' + (DIFF[x.difficulte] || '') : '')
        + (x.notions && x.notions.length ? ' · ' + x.notions.slice(0, 3).join('، ') : '')
        + '</span></button>').join('');
    }).catch(() => { boite.textContent = 'تعذّر التحميل.'; });
  }

  document.addEventListener('click', e => {
    const r = e.target.closest('.rub');
    if (r) { e.preventDefault(); ouvrir(r); return; }
    const b = e.target.closest('.exo-btn');
    if (!b) return;
    const i = PANIER.indexOf(b.dataset.id);
    if (i >= 0) { PANIER.splice(i, 1); b.classList.remove('pris'); }
    else { PANIER.push(b.dataset.id); b.classList.add('pris'); }
    etat(); feuille();
  });

  const date = (() => { const d = new Date();
    return d.getDate() + ' ' + MOIS[d.getMonth()] + ' ' + d.getFullYear(); })();

  // ── LA FEUILLE. Un exercice entier par bloc, jamais tronqué : son énoncé
  //    une fois, ses questions numérotées dessous, et la place pour écrire.
  function feuille() {
    const exos = PANIER.map(id => TOUT().find(x => x.id === id)).filter(Boolean);
    if (!exos.length) { el('#feuille').innerHTML = ''; return; }
    const noms = [...new Set(exos.map(x => x.chapitreNom))];
    const nivs = [...new Set(exos.map(x => x.niveau))].sort();
    const sujet = noms.length <= 2 ? noms.join(' — ')
                : nivs.map(n => n + ' أساسي').join(' و ');

    let h = '<div class="entete"><h2>ورقة مراجعة — ' + sujet + '</h2>'
      + '<div class="lignes"><span>الاسم:</span><span>القسم:</span>'
      + '<span>التاريخ: ' + date + '</span></div></div>';

    exos.forEach((x, i) => {
      const lignes = Math.max(4, x.correction.length);
      h += '<div class="exo"><div class="tete">'
        + '<span class="num">التمرين ' + (i + 1) + '</span>'
        + '<span class="rub">' + x.rubriqueNom
        + (x.difficulte ? ' · ' + (DIFF[x.difficulte] || '') : '') + '</span>'
        + '</div><div class="enonce">' + x.enonce + '</div>'
        + '<div class="espace" style="height:' + (lignes * 1.7) + 'em"></div></div>';
    });

    if (avecCor()) {
      h += '<div class="separation">الإصلاح</div>';
      exos.forEach((x, i) => {
        h += '<div class="corr"><span class="num">التمرين ' + (i + 1) + '</span>'
          + '<ol>' + x.correction.map(e =>
              '<li><span class="quoi">' + (e.quoi ? e.quoi + ' — ' : '') + '</span>'
              + e.math + '</li>').join('')
          + '</ol></div>';
      });
    }
    el('#feuille').innerHTML = h;
  }
  etat();
  el('#creer').addEventListener('click', feuille);
  el('#imprimer').addEventListener('click', () => window.print());

  // LA POLICE SE DEMANDE APRÈS « load », JAMAIS AVANT.
  //
  // Une feuille de style retarde l'événement « load » tant qu'elle n'a pas
  // répondu. Hors ligne, la requête met treize secondes à échouer : la page
  // était utilisable en 136 ms, mais le navigateur gardait sa roue qui tourne
  // tout ce temps — et un élève qui voit tourner croit que c'est cassé.
  // Posée après « load », elle n'a plus rien à retarder ; si elle n'arrive
  // jamais, l'arabe s'affiche dans la police du système, et c'est tout.
  addEventListener('load', () => {
    const police = document.createElement('link');
    police.rel = 'stylesheet';
    police.href = 'https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap';
    document.head.appendChild(police);
  });
})();
</script>
</body>
</html>
